<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WRNV Email Confirmed</title>

  <style>
    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #151524;
      padding: 40px;
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #b8b8c7;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      background: #7c3aed;
      color: white;
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
    }

    .success {
      font-size: 50px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Replace with your WRNV logo -->
    <img src="/wrnv-vault-hero.png" class="logo" alt="WRNV Logo" />

    <div class="success">✅</div>

    <h1>Email Confirmed</h1>

    <p>
      Your WRNV account has been verified successfully.
      You can now open the app and start tracking your
      movies and TV shows.
    </p>

    <a class="button" href="wrnv://login">
      Open WRNV
    </a>

  </div>
</body>
</html>
